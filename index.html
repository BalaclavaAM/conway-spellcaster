<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conway Spellcaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
</head>
<body>
<header id="hud">
  <h1 class="pixel">CONWAY SPELLCASTER</h1>
  <div class="hud-stats mono">
    <div class="hud-gen">gen <span id="gen">0</span></div>
    <div class="hud-turn">turn <span id="turn">0</span> / <span id="maxturn">30</span></div>
  </div>
</header>

<main id="app">
  <div id="board-wrap">
    <canvas id="board" width="800" height="480"></canvas>
  </div>
  <div id="panel" class="mono"></div>
</main>

<div id="overlay"></div>
<div id="crt" aria-hidden="true"></div>

<script type="module" src="js/game.js"></script>
</body>
</html>
